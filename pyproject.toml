[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bridge"
version = "0.1.0"
description = "Vendor-neutral policy and evidence adapter layer to Agent Auth Gateway and Agent Flight Recorder."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Ingenious AI"}]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agent-bridge = "agent_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["agent_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
